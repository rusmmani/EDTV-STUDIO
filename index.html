var(--line);border-radius:12px;background:#fcfcfe;position:relative}.block-label{font-size:11px;font-weight:800;text-transform:uppercase;color:#6d5dfc;padding-top:4px}.block textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;min-height:44px;color:#20232b}.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mood{border:1px solid var(--line);border-radius:14px;padding:13px;min-height:180px;overflow:hidden}.mood-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mood-title{font-weight:700;font-size:13px}.preview{height:120px;border-radius:10px;background:#f1f2f6;overflow:hidden;display:grid;place-items:center;color:#9ca3af;font-size:12px}.preview img{width:100%;height:100%;object-fit:cover}.upload{margin-top:9px;width:100%}.video{border:1px dashed #d8dbe5;padding:22px;border-radius:14px;text-align:center;color:var(--muted);display:grid;gap:12px}.video video{width:100%;max-height:500px;border-radius:12px;background:#111}.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#f0efff,#f6f7fb 45%)}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 70px rgba(20,25,40,.08)}.auth-brand{margin:0 0 28px}.auth-card h1{font-size:27px;margin:8px 0}.auth-card>p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:22px}.auth-card label{display:grid;gap:7px;font-size:12px;font-weight:700;margin-top:14px}.auth-card input,.create-row input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff}.auth-card input:focus,.create-row input:focus{border-color:#9b93ff;box-shadow:0 0 0 3px #eeeaff}.auth-submit{width:100%;margin-top:18px}.link-button{border:0;background:none;color:#5144d8;font-weight:700;font-size:12px;margin-top:14px}.notice{margin-top:13px;padding:10px 12px;background:#f5f3ff;border-radius:10px;color:#5144d8;font-size:12px}.auth-loading,.screen-loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.logout{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}.create-card{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.create-card h2{font-size:19px;margin:7px 0 4px}.create-row{display:flex;gap:8px;min-width:min(520px,100%)}.create-row input{flex:1}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.section-head h2{font-size:19px;margin:0 0 5px}.project-grid{display:grid;gap:12px}.project-card{display:flex;align-items:center;gap:14px}.project-icon{width:44px;height:44px;border-radius:12px;background:#f1f1ff;color:#5144d8;display:grid;place-items:center}.project-info{flex:1}.project-info h2{font-size:16px;margin:4px 0}.project-info p{margin:0}.project-actions{display:flex;gap:7px;align-items:center}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:35px;height:35px;display:grid;place-items:center;color:#737987}.icon-btn:hover{background:#f8f8fb}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty h2{color:#111827;margin:12px 0 4px}.empty p{margin:0}.empty-inline{padding:25px;text-align:center;color:var(--muted);background:#fafafe;border-radius:12px}.save-status{font-size:12px;color:#5144d8}.block-delete{position:absolute;right:8px;top:8px}.alert{position:fixed;right:20px;bottom:20px;z-index:50;background:#151922;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.18);font-size:13px;max-width:min(420px,calc(100vw - 40px))}.hidden{display:none!important}.config-warning{margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff4e5;color:#8a4b00;font-size:12px;line-height:1.5}.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:20px;z-index:40}.modal{width:min(440px,100%);background:#fff;border-radius:18px;padding:22px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted);line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:900px){.sidebar{width:190px}}@media(max-width:800px){.create-card{display:block}.create-row{margin-top:14px;min-width:0}.section-head{align-items:flex-start;flex-direction:column}.section-head .row{flex-wrap:wrap}.project-card{align-items:flex-start;flex-wrap:wrap}.project-actions{width:100%}.project-actions .btn{flex:1}}@media(max-width:650px){.edtv{display:block}.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.moods{grid-template-columns:1fr}.block{grid-template-columns:1fr;gap:4px}.topbar{align-items:flex-start;gap:10px;flex-direction:column}}
  .mood .preview{aspect-ratio:16/9;height:auto;min-height:0;cursor:zoom-in;position:relative;background:#111}.mood .preview img{display:block;width:100%;height:100%;object-fit:cover}.mood .preview:has(.mood-collage.one){display:block;height:auto;aspect-ratio:auto}.mood .preview:has(.mood-collage.one) .mood-collage.one{width:100%;height:auto;display:block}.mood .preview:has(.mood-collage.one) .mood-collage.one img{width:100%;height:auto;display:block;object-fit:contain}.mood-collage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2px;width:100%;height:100%}.mood-collage.one{display:block}.mood-collage.one img{width:100%;height:100%}.mood-collage.two img:first-child{grid-row:1/3}.mood-collage.three img:first-child{grid-row:1/3}.mood-count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.68);color:#fff;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}.mood-empty{width:100%;height:100%;display:grid;place-items:center}.photo-modal{position:fixed;inset:0;background:rgba(5,8,15,.92);z-index:100;display:grid;grid-template-rows:auto 1fr auto;padding:18px}.photo-modal-head{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:12px}.photo-modal-title{font-weight:800;font-size:14px}.photo-modal-stage{display:grid;place-items:center;min-height:0;padding:12px}.photo-modal-stage img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.photo-modal-controls{display:flex;justify-content:center;align-items:center;gap:12px;color:#fff}.photo-modal-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;min-width:44px;height:44px;padding:0 14px}.photo-modal-btn:hover{background:rgba(255,255,255,.18)}.photo-modal-index{font-size:12px;color:rgba(255,255,255,.72);min-width:65px;text-align:center}.mood-desc-label{display:block;font-size:12px;font-weight:700;color:#5f6672;margin:12px 0 6px}.mood-desc{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#fafafa;padding:10px 11px;font:inherit;font-size:13px;line-height:1.45;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}.mood-desc:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .mood-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.mood-actions .upload{margin-top:0;grid-column:1/-1}.mood-actions .danger{color:#b42318;border-color:#f0c7c3;background:#fff7f6}.btn,.icon-btn,.preview,.photo-modal-btn{transition:transform .18s ease,opacity .18s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease}.btn:active,.icon-btn:active,.photo-modal-btn:active{transform:scale(.96)}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,25,40,.06)}.preview{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}.preview:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,25,40,.12)}.mood-collage img{transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s ease}.preview:hover .mood-collage img{transform:scale(1.025);filter:saturate(1.04)}.photo-modal{animation:photoFade .22s ease both}.photo-modal-stage img{animation:photoZoom .34s cubic-bezier(.2,.8,.2,1) both}.photo-modal-controls{animation:photoSlideUp .28s ease .04s both}.photo-modal-btn{backdrop-filter:blur(12px)}.photo-modal-btn:disabled{opacity:.35;cursor:not-allowed}.photo-modal-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}.photo-modal-tools .danger{color:#ffd6d2;border-color:rgba(255,120,110,.35)}.photo-modal-counter{font-size:12px;color:rgba(255,255,255,.72);min-width:65px;text-align:center}@keyframes photoFade{from{opacity:0}to{opacity:1}}@keyframes photoZoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@keyframes photoSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .scene-list{display:grid;gap:18px}.scene-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;animation:sceneIn .35s ease both}.scene-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.scene-kicker{font-size:10px;letter-spacing:.12em;font-weight:800;color:#6d5dfc;text-transform:uppercase;margin-bottom:5px}.scene-name{font-size:20px;font-weight:800;border:0;outline:0;background:transparent;padding:0;width:min(520px,100%)}.scene-desc{display:block;width:min(650px,100%);min-height:42px;margin-top:7px;border:0;outline:0;resize:vertical;color:var(--muted);font-size:12px;background:transparent}.mood-collage.many{display:grid;gap:2px;width:100%;height:100%}.mood-collage.many img{width:100%;height:100%;object-fit:cover;min-width:0;min-height:0}.scene-video{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafafe;display:grid;gap:10px}.scene-video>div:first-child{font-size:13px}.scene-video>div:first-child span{color:var(--muted);font-weight:400}.scene-video video{width:100%;max-height:460px;border-radius:12px;background:#111}.video-empty{min-height:120px;border:1px dashed #d8dbe5;border-radius:12px;display:grid;place-items:center;color:var(--muted);gap:7px}.photo-modal-bottom{display:grid;gap:10px;justify-items:center}.photo-modal-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.photo-modal-stage img{animation:photoIn .28s ease both}.photo-modal{animation:modalIn .22s ease both}.btn,.photo-modal-btn{transition:transform .18s ease,opacity .18s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease}.btn:active,.photo-modal-btn:active{transform:scale(.96)}@keyframes sceneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes photoIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes modalIn{from{opacity:0}to{opacity:1}}@media(max-width:650px){.scene-head{flex-direction:column}.scene-name{font-size:18px}.photo-modal{padding:12px}.photo-modal-stage img{max-height:70vh}}

<body>
<div id="app"><div class="screen-loading">Memuat EDTV Studio…</div></div>
<div id="toast" class="alert hidden"></div>
<div id="modalRoot"></div>
<script>
(() => {
  const cfg = window.EDTV_CONFIG || {};
  const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes('YOUR_PROJECT') && cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
  const sb = configured ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  const BUCKET='edtv-assets';
  const moodDefaults=[['environment','FOTO ENVIRONMENT'],['talent','FOTO KETIKA ADA TALENT'],['pov','FOTO DARI SUDUT PANDANG TALENT'],['light','FOTO ARAH CAHAYA']];
  let session=null, routeProject=null, state={projects:[],blocks:[],scenes:[],tab:'script',name:'',saving:false,scriptSceneId:null};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const icon=(name,size=16)=>({film:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg>`,file:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v6h6"/></svg>`,image:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`,play:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>`,logout:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,back:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,trash:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>`,upload:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 20h14"/></svg>`,replace:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.5-4L3 10m0 0V4m0 6h6M4 13a8.1 8.1 0 0 0 14.5 4L21 14m0 0v6m0-6h-6"/></svg>`}[name]||'');
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),3500)}
  function err(e){toast(e?.message||'Terjadi kesalahan.');console.error(e)}
  function go(path){location.hash=path}
  function safeFile(name){return name.replace(/[^a-zA-Z0-9._-]/g,'-')}
  function storagePath(userId,projectId,category,filename){return `${userId}/${projectId}/${category}/${crypto.randomUUID()}-${safeFile(filename)}`}
  async function signedUrl(path){const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);if(error) throw error;return data.signedUrl}
  function configuredCheck(){if(!configured){$('app').innerHTML=`<main class="auth-page"><div class="auth-card"><div class="brand auth-brand"><span class="logo">${icon('film',18)}</span>EDTV Studio</div><div class="eyebrow">Configuration diperlukan</div><h1>Hubungkan Supabase</h1><p>Edit file <b>config.js</b> lalu isi Project URL dan Publishable/anon key dari Supabase.</p><div class="config-warning">Jangan gunakan <b>service_role</b> key di website. Gunakan key client/publishable/anon dan pastikan RLS aktif dari schema.sql.</div></div></main>`;return false}return true}
  async function init(){if(!configuredCheck())return;const {data}=await sb.auth.getSession();session=data.session;sb.auth.onAuthStateChange((_e,s)=>{session=s;if(!s)go('/');render()});render()}
  function authView(){
    const signup=window.__authMode==='signup';
    $('app').innerHTML=`<main class="auth-page"><form id="authForm" class="auth-card"><div class="brand auth-brand"><span class="logo">${icon('film',18)}</span>EDTV Studio</div><div class="eyebrow">Creative production workspace</div><h1>${signup?'Buat akun EDTV':'Masuk ke workspace'}</h1><p>Data project, script, moodboard, dan video disimpan di Supabase.</p><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><div id="authMsg"></div><button class="btn primary auth-submit" id="authSubmit">${signup?'Daftar':'Masuk'}</button><button type="button" class="link-button" id="authSwitch">${signup?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button></form></main>`;
    $('authForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=$('authSubmit');btn.disabled=true;$('authMsg').innerHTML='';
      const email=$('email').value.trim(),password=$('password').value;
      const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
      btn.disabled=false;
      if(r.error){$('authMsg').innerHTML=`<div class="notice">${esc(r.error.message)}</div>`;return}
      if(signup&&!r.data.session){$('authMsg').innerHTML='<div class="notice">Akun dibuat. Cek email untuk konfirmasi, lalu login.</div>';return}
      session=r.data.session;go('/');
    };
    $('authSwitch').onclick=()=>{window.__authMode=signup?'login':'signup';authView()};
  }
  async function loadProjects(){const {data,error}=await sb.from('projects').select('id,name,event_type,created_at').order('created_at',{ascending:false});if(error)throw error;state.projects=data||[]}

  function closePhotoModal(){$('modalRoot').innerHTML=''}
  document.addEventListener('keydown',e=>{if(!$('modalRoot').firstElementChild)return;if(e.key==='Escape')closePhotoModal();if(e.key==='ArrowLeft')$('photoPrev')?.click();if(e.key==='ArrowRight')$('photoNext')?.click()});
  async function uploadSceneVideo(sceneId,file){if(!file)return;try{toast('Mengupload walkthrough…');const {data:u}=await sb.auth.getUser();const scene=state.scenes.find(x=>x.id===sceneId);const path=storagePath(u.user.id,routeProject,`scene-${sceneId}-walkthrough`,file.name);const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;if(scene.video.path)await sb.storage.from(BUCKET).remove([scene.video.path]);if(scene.video.id)await sb.from('moodboard_scene_videos').delete().eq('id',scene.video.id);const {data:item,error:de}=await sb.from('moodboard_scene_videos').insert({scene_id:sceneId,storage_path:path}).select('*').single();if(de)throw de;scene.video={id:item.id,path,url:await signedUrl(path)};workspaceView();toast('Walkthrough scene tersimpan.')}catch(e){err(e)}}
  async function logout(){await sb.auth.signOut();session=null;go('/')}
  async function render(){if(!configured)return;if(!session){authView();return}const hash=location.hash||'#/' ;const path=hash.slice(1);if(path.startsWith('/projects/')){routeProject=path.split('/')[2];$('app').innerHTML='<div class="screen-loading">Memuat workspace…</div>';try{await loadWorkspace(routeProject);workspaceView()}catch(e){err(e);go('/')}}else{routeProject=null;$('app').innerHTML='<div class="screen-loading">Memuat projects…</div>';try{await loadProjects();dashboardView()}catch(e){err(e)}}}
  window.addEventListener('hashchange',render);window.__authMode='login';init();
})();
</script>
</body>
