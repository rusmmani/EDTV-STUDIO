<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d5dfc">
  <title>EDTV Studio</title>
  <meta name="description" content="Creative production workspace for scripts, moodboards and walkthroughs.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f6f7fb;color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}:root{--line:#e7e9ef;--muted:#737987;--purple:#6d5dfc;--blue:#3478f6}.edtv{min-height:100vh;display:flex}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin:0 8px 28px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6d5dfc,#4da3ff);display:grid;place-items:center;color:white}.nav{display:grid;gap:6px}.nav button,.nav a{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#6b7280;text-decoration:none;font-size:13.33px;display:flex;align-items:center;gap:8px}.nav button.active,.nav button:hover,.nav a:hover{background:#f1f1ff;color:#5144d8}.project-mini{margin-top:30px;padding:13px;border:1px solid var(--line);border-radius:13px}.project-mini small{color:var(--muted)}.main{flex:1;padding:30px;max-width:1450px;margin:auto;width:100%}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}h1{font-size:30px;margin:5px 0 0;letter-spacing:-.04em}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(20,25,40,.035)}.card h2{font-size:16px;margin:0 0 5px}.card p{color:var(--muted);font-size:13px;margin:0 0 17px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px}.btn.primary{background:#151922;color:#fff;border-color:#151922}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.ghost{background:#f7f7fb}.row{display:flex;gap:9px;align-items:center}.script{display:grid;gap:9px}.block{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fcfcfe;position:relative}.block-label{font-size:11px;font-weight:800;text-transform:uppercase;color:#6d5dfc;padding-top:4px}.block textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;min-height:44px;color:#20232b}.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mood{border:1px solid var(--line);border-radius:14px;padding:13px;min-height:180px;overflow:hidden}.mood-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mood-title{font-weight:700;font-size:13px}.preview{height:120px;border-radius:10px;background:#f1f2f6;overflow:hidden;display:grid;place-items:center;color:#9ca3af;font-size:12px}.preview img{width:100%;height:100%;object-fit:cover}.upload{margin-top:9px;width:100%}.video{border:1px dashed #d8dbe5;padding:22px;border-radius:14px;text-align:center;color:var(--muted);display:grid;gap:12px}.video video{width:100%;max-height:500px;border-radius:12px;background:#111}.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#f0efff,#f6f7fb 45%)}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 70px rgba(20,25,40,.08)}.auth-brand{margin:0 0 28px}.auth-card h1{font-size:27px;margin:8px 0}.auth-card>p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:22px}.auth-card label{display:grid;gap:7px;font-size:12px;font-weight:700;margin-top:14px}.auth-card input,.create-row input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff}.auth-card input:focus,.create-row input:focus{border-color:#9b93ff;box-shadow:0 0 0 3px #eeeaff}.auth-submit{width:100%;margin-top:18px}.link-button{border:0;background:none;color:#5144d8;font-weight:700;font-size:12px;margin-top:14px}.notice{margin-top:13px;padding:10px 12px;background:#f5f3ff;border-radius:10px;color:#5144d8;font-size:12px}.auth-loading,.screen-loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.logout{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}.create-card{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.create-card h2{font-size:19px;margin:7px 0 4px}.create-row{display:flex;gap:8px;min-width:min(520px,100%)}.create-row input{flex:1}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.section-head h2{font-size:19px;margin:0 0 5px}.project-grid{display:grid;gap:12px}.project-card{display:flex;align-items:center;gap:14px}.project-icon{width:44px;height:44px;border-radius:12px;background:#f1f1ff;color:#5144d8;display:grid;place-items:center}.project-info{flex:1}.project-info h2{font-size:16px;margin:4px 0}.project-info p{margin:0}.project-actions{display:flex;gap:7px;align-items:center}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:35px;height:35px;display:grid;place-items:center;color:#737987}.icon-btn:hover{background:#f8f8fb}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty h2{color:#111827;margin:12px 0 4px}.empty p{margin:0}.empty-inline{padding:25px;text-align:center;color:var(--muted);background:#fafafe;border-radius:12px}.save-status{font-size:12px;color:#5144d8}.block-delete{position:absolute;right:8px;top:8px}.alert{position:fixed;right:20px;bottom:20px;z-index:50;background:#151922;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.18);font-size:13px;max-width:min(420px,calc(100vw - 40px))}.hidden{display:none!important}.config-warning{margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff4e5;color:#8a4b00;font-size:12px;line-height:1.5}.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:20px;z-index:40}.modal{width:min(440px,100%);background:#fff;border-radius:18px;padding:22px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted);line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:900px){.sidebar{width:190px}}@media(max-width:800px){.create-card{display:block}.create-row{margin-top:14px;min-width:0}.section-head{align-items:flex-start;flex-direction:column}.section-head .row{flex-wrap:wrap}.project-card{align-items:flex-start;flex-wrap:wrap}.project-actions{width:100%}.project-actions .btn{flex:1}}@media(max-width:650px){.edtv{display:block}.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.moods{grid-template-columns:1fr}.block{grid-template-columns:1fr;gap:4px}.topbar{align-items:flex-start;gap:10px;flex-direction:column}}
  </style>
</head>
<body>
<div id="app"><div class="screen-loading">Memuat EDTV Studio…</div></div>
<div id="toast" class="alert hidden"></div>
<div id="modalRoot"></div>
<script>
(() => {
  const cfg = window.EDTV_CONFIG || {};
  const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes('YOUR_PROJECT') && cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
  const sb = configured ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  const BUCKET='edtv-assets';
  const moodDefaults=[['environment','FOTO ENVIRONMENT'],['talent','FOTO KETIKA ADA TALENT'],['pov','FOTO DARI SUDUT PANDANG TALENT'],['light','FOTO ARAH CAHAYA']];
  let session=null, routeProject=null, state={projects:[],blocks:[],moods:[],video:{},tab:'script',name:'',saving:false};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const icon=(name,size=16)=>({film:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg>`,file:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v6h6"/></svg>`,image:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`,play:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>`,logout:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,back:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,trash:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>`,upload:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 20h14"/></svg>`,replace:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.5-4L3 10m0 0V4m0 6h6M4 13a8.1 8.1 0 0 0 14.5 4L21 14m0 0v6m0-6h-6"/></svg>`}[name]||'');
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),3500)}
  function err(e){toast(e?.message||'Terjadi kesalahan.');console.error(e)}
  function go(path){location.hash=path}
  function safeFile(name){return name.replace(/[^a-zA-Z0-9._-]/g,'-')}
  function storagePath(userId,projectId,category,filename){return `${userId}/${projectId}/${category}/${crypto.randomUUID()}-${safeFile(filename)}`}
  async function signedUrl(path){const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);if(error) throw error;return data.signedUrl}
  function configuredCheck(){if(!configured){$('app').innerHTML=`<main class="auth-page"><div class="auth-card"><div class="brand auth-brand"><span class="logo">${icon('film',18)}</span>EDTV Studio</div><div class="eyebrow">Configuration diperlukan</div><h1>Hubungkan Supabase</h1><p>Edit file <b>config.js</b> lalu isi Project URL dan Publishable/anon key dari Supabase.</p><div class="config-warning">Jangan gunakan <b>service_role</b> key di website. Gunakan key client/publishable/anon dan pastikan RLS aktif dari schema.sql.</div></div></main>`;return false}return true}
  async function init(){if(!configuredCheck())return;const {data}=await sb.auth.getSession();session=data.session;sb.auth.onAuthStateChange((_e,s)=>{session=s;if(!s)go('/');render()});render()}
  function authView(){
    const signup=window.__authMode==='signup';
    $('app').innerHTML=`<main class="auth-page"><form id="authForm" class="auth-card"><div class="brand auth-brand"><span class="logo">${icon('film',18)}</span>EDTV Studio</div><div class="eyebrow">Creative production workspace</div><h1>${signup?'Buat akun EDTV':'Masuk ke workspace'}</h1><p>Data project, script, moodboard, dan video disimpan di Supabase.</p><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><div id="authMsg"></div><button class="btn primary auth-submit" id="authSubmit">${signup?'Daftar':'Masuk'}</button><button type="button" class="link-button" id="authSwitch">${signup?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button></form></main>`;
    $('authForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=$('authSubmit');btn.disabled=true;$('authMsg').innerHTML='';
      const email=$('email').value.trim(),password=$('password').value;
      const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
      btn.disabled=false;
      if(r.error){$('authMsg').innerHTML=`<div class="notice">${esc(r.error.message)}</div>`;return}
      if(signup&&!r.data.session){$('authMsg').innerHTML='<div class="notice">Akun dibuat. Cek email untuk konfirmasi, lalu login.</div>';return}
      session=r.data.session;go('/');
    };
    $('authSwitch').onclick=()=>{window.__authMode=signup?'login':'signup';authView()};
  }
  async function loadProjects(){const {data,error}=await sb.from('projects').select('id,name,event_type,created_at').order('created_at',{ascending:false});if(error)throw error;state.projects=data||[]}
  function dashboardView(){const ps=state.projects; $('app').innerHTML=`<div class="edtv"><aside class="sidebar"><div class="brand"><span class="logo">${icon('film',18)}</span>EDTV</div><div class="nav"><button class="active">${icon('file',15)} Projects</button></div><div class="project-mini"><small>BACKEND</small><div style="font-weight:700;margin-top:6px">Supabase</div><div style="font-size:12px;color:#737987;margin-top:3px">Database + Storage</div></div><button class="btn ghost logout" id="logout">${icon('logout',15)} Keluar</button></aside><main class="main"><div class="topbar"><div><div class="eyebrow">Creative production workspace</div><h1>EDTV Studio</h1></div></div><section class="card create-card"><div><div class="eyebrow">PROJECT BARU</div><h2>Buat workspace produksi</h2><p>Semua data akan tersimpan otomatis di Supabase.</p></div><div class="create-row"><input id="projectName" placeholder="Nama project, misalnya: Film Kiko"><button class="btn primary" id="newProject">＋ New Project</button></div></section><div class="section-head"><div><h2>Projects</h2><p>Project yang tersimpan di akun ini.</p></div></div>${ps.length?`<div class="project-grid">${ps.map(p=>`<div class="card project-card"><div class="project-icon">${icon('film',20)}</div><div class="project-info"><div class="eyebrow">${esc(p.event_type.replace('_',' '))}</div><h2>${esc(p.name)}</h2><p>Dibuat ${new Date(p.created_at).toLocaleDateString('id-ID')}</p></div><div class="project-actions"><button class="btn primary open-project" data-id="${p.id}">Open →</button><button class="icon-btn delete-project" data-id="${p.id}" aria-label="Hapus">${icon('trash',16)}</button></div></div>`).join('')}</div>`:`<div class="card empty">${icon('film',30)}<h2>Belum ada project</h2><p>Buat project pertama untuk mulai.</p></div>`}</main></div>`;$('logout').onclick=logout;$('newProject').onclick=createProject;$('projectName').onkeydown=e=>{if(e.key==='Enter')createProject()};document.querySelectorAll('.open-project').forEach(b=>b.onclick=()=>go('/projects/'+b.dataset.id));document.querySelectorAll('.delete-project').forEach(b=>b.onclick=()=>deleteProject(b.dataset.id))}
  async function createProject(){const input=$('projectName');const name=(input?.value||'').trim()||'Untitled Project';const {data:u}=await sb.auth.getUser();if(!u.user)return;const {data,error}=await sb.from('projects').insert({user_id:u.user.id,name,event_type:'PHOTOSHOOT'}).select('id').single();if(error)return err(error);go('/projects/'+data.id)}
  async function deleteProject(id){if(!confirm('Hapus project ini beserta script dan referensinya?'))return;const {error}=await sb.from('projects').delete().eq('id',id);if(error)return err(error);await loadProjects();dashboardView();toast('Project dihapus.')}
  async function loadWorkspace(id){state.blocks=[];state.moods=[];state.video={};const {data:p,error:pe}=await sb.from('projects').select('*').eq('id',id).single();if(pe||!p){toast('Project tidak ditemukan atau kamu tidak punya akses.');go('/');return}const {data:b}=await sb.from('script_blocks').select('*').eq('project_id',id).order('position');state.blocks=b||[];const {data:m}=await sb.from('moodboard_items').select('*').eq('project_id',id);state.moods=await Promise.all(moodDefaults.map(async([key,title])=>{const x=(m||[]).find(v=>v.category===key);return x?{key,title,id:x.id,path:x.storage_path,file:await signedUrl(x.storage_path)}:{key,title}}));const {data:v}=await sb.from('walkthrough_videos').select('*').eq('project_id',id).order('created_at',{ascending:false}).limit(1).maybeSingle();state.video=v?{id:v.id,path:v.storage_path,url:await signedUrl(v.storage_path)}:{};state.project=p}
  function workspaceView(){const p=state.project;$('app').innerHTML=`<div class="edtv"><aside class="sidebar"><div class="brand"><span class="logo">${icon('film',18)}</span>EDTV</div><div class="nav"><a href="#/">${icon('back',15)} Projects</a><button class="${state.tab==='script'?'active':''}" id="tabScript">${icon('file',15)} Script</button><button class="${state.tab==='moodboard'?'active':''}" id="tabMood">${icon('image',15)} Moodboard</button><button class="${state.tab==='walkthrough'?'active':''}" id="tabVideo">${icon('play',15)} Walkthrough</button></div><div class="project-mini"><small>PROJECT</small><div style="font-weight:700;margin-top:6px">${esc(p.name)}</div><div style="font-size:12px;color:#737987;margin-top:3px">ID: ${p.id.slice(0,8)}…</div></div><button class="btn ghost logout" id="logout">${icon('logout',15)} Keluar</button></aside><main class="main"><div class="topbar"><div><div class="eyebrow">${esc(p.event_type)}</div><h1>${esc(p.name)}</h1></div><div id="saveStatus" class="save-status"></div></div>${state.tab==='script'?scriptView():state.tab==='moodboard'?moodView():videoView()}</main></div>`;$('logout').onclick=logout;$('tabScript').onclick=()=>{state.tab='script';workspaceView()};$('tabMood').onclick=()=>{state.tab='moodboard';workspaceView()};$('tabVideo').onclick=()=>{state.tab='walkthrough';workspaceView()};if(state.tab==='script')bindScript();if(state.tab==='moodboard')bindMood();if(state.tab==='walkthrough')bindVideo()}
  function scriptView(){return `<section class="card"><div class="section-head"><div><h2>Script</h2><p>Blok script tersimpan langsung ke Supabase Database.</p></div><div class="row"><button class="btn" data-add="action">＋ Action</button><button class="btn" data-add="dialog">＋ Dialog</button><button class="btn" data-add="expression">＋ Expression</button><button class="btn" data-add="shot">＋ Shot</button><button class="btn primary" id="saveBlocks">${state.saving?'Saving…':'Save'}</button></div></div><div class="script">${state.blocks.map(b=>`<div class="block"><div class="block-label">${esc(b.type)}${b.meta?' · '+esc(b.meta):''}</div><textarea data-block="${b.id}">${esc(b.content)}</textarea><button class="icon-btn block-delete" data-delete="${b.id}">${icon('trash',14)}</button></div>`).join('')}</div>${!state.blocks.length?'<div class="empty-inline">Belum ada blok script. Tambahkan Action, Dialog, Expression, atau Shot.</div>':''}</section>`}
  function bindScript(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addBlock(b.dataset.add));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteBlock(b.dataset.delete));document.querySelectorAll('[data-block]').forEach(t=>t.oninput=()=>{const x=state.blocks.find(v=>v.id===t.dataset.block);if(x)x.content=t.value});$('saveBlocks').onclick=saveBlocks}
  async function addBlock(type){const position=state.blocks.length;const {data,error}=await sb.from('script_blocks').insert({project_id:routeProject,type,content:'Tulis isi di sini…',position}).select('*').single();if(error)return err(error);state.blocks.push(data);workspaceView()}
  async function saveBlocks(){state.saving=true;workspaceView();const {error}=await sb.from('script_blocks').upsert(state.blocks.map((b,i)=>({id:b.id,project_id:routeProject,type:b.type,content:b.content,meta:b.meta,position:i})));state.saving=false;workspaceView();if(error)return err(error);toast('Script tersimpan.')}
  async function deleteBlock(id){const {error}=await sb.from('script_blocks').delete().eq('id',id);if(error)return err(error);state.blocks=state.blocks.filter(x=>x.id!==id);workspaceView()}
  function moodView(){return `<section class="card"><div class="section-head"><div><h2>Moodboard</h2><p>Foto disimpan di Supabase Storage bucket <b>${BUCKET}</b>.</p></div></div><div class="moods">${state.moods.map(m=>`<div class="mood"><div class="mood-head"><span class="mood-title">${esc(m.title)}</span>${icon('image',16)}</div><div class="preview">${m.file?`<img src="${esc(m.file)}" alt="${esc(m.title)}">`:'<span>Belum ada foto</span>'}</div><input hidden id="file-${m.key}" type="file" accept="image/*"><button class="btn ghost upload" data-upload-mood="${m.key}">${m.file?icon('replace',15):icon('upload',15)} ${m.file?'Ganti Foto':'Upload Foto'}</button></div>`).join('')}</div></section>`}
  function bindMood(){document.querySelectorAll('[data-upload-mood]').forEach(b=>b.onclick=()=>{const key=b.dataset.uploadMood;const input=$('file-'+key);input.onchange=()=>uploadMood(key,input.files?.[0]);input.click()})}
  async function uploadMood(key,file){if(!file)return;try{toast('Mengupload foto…');const {data:u}=await sb.auth.getUser();if(!u.user)return;const old=state.moods.find(m=>m.key===key);const path=storagePath(u.user.id,routeProject,key,file.name);const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;if(old?.path)await sb.storage.from(BUCKET).remove([old.path]);if(old?.id)await sb.from('moodboard_items').delete().eq('id',old.id);const {data:item,error:dbError}=await sb.from('moodboard_items').insert({project_id:routeProject,category:key,storage_path:path}).select('*').single();if(dbError)throw dbError;const url=await signedUrl(path);state.moods=state.moods.map(m=>m.key===key?{...m,id:item.id,path,file:url}:m);workspaceView();toast('Foto tersimpan.')}catch(e){err(e)}}
  function videoView(){return `<section class="card"><h2>Walkthrough Video</h2><p>Upload video walkthrough lokasi produksi ke Supabase Storage.</p><div class="video">${state.video.url?`<video src="${esc(state.video.url)}" controls></video>`:`${icon('play',28)}<div>Belum ada walkthrough</div>`}<input hidden id="videoInput" type="file" accept="video/*"><button class="btn primary" id="videoUpload">${icon('upload',15)} ${state.video.url?'Ganti Video':'Upload Video'}</button></div></section>`}
  function bindVideo(){$('videoUpload').onclick=()=>{const i=$('videoInput');i.onchange=()=>uploadVideo(i.files?.[0]);i.click()}}
  async function uploadVideo(file){if(!file)return;try{toast('Mengupload video…');const {data:u}=await sb.auth.getUser();if(!u.user)return;const path=storagePath(u.user.id,routeProject,'walkthrough',file.name);const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;if(state.video.path)await sb.storage.from(BUCKET).remove([state.video.path]);if(state.video.id)await sb.from('walkthrough_videos').delete().eq('id',state.video.id);const {data:item,error:dbError}=await sb.from('walkthrough_videos').insert({project_id:routeProject,storage_path:path}).select('*').single();if(dbError)throw dbError;state.video={id:item.id,path,url:await signedUrl(path)};workspaceView();toast('Video tersimpan.')}catch(e){err(e)}}
  async function logout(){await sb.auth.signOut();session=null;go('/')}
  async function render(){if(!configured)return;if(!session){authView();return}const hash=location.hash||'#/' ;const path=hash.slice(1);if(path.startsWith('/projects/')){routeProject=path.split('/')[2];$('app').innerHTML='<div class="screen-loading">Memuat workspace…</div>';try{await loadWorkspace(routeProject);workspaceView()}catch(e){err(e);go('/')}}else{routeProject=null;$('app').innerHTML='<div class="screen-loading">Memuat projects…</div>';try{await loadProjects();dashboardView()}catch(e){err(e)}}}
  window.addEventListener('hashchange',render);window.__authMode='login';init();
})();
</script>
</body>
</html>
